# 로컬 개발용 PostgreSQL. 값은 next/.env.example 의 DATABASE_URL 과 맞춘다.
# 다른 로컬 프로젝트의 Postgres(5431~5434)와 겹치지 않도록 호스트 포트는 5435 를 쓴다.
services:
  postgres:
    image: postgres:17
    ports:
      # loopback 에만 연다 — 같은 네트워크의 다른 기기에서 접속되지 않게.
      - "127.0.0.1:5435:5432"
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
